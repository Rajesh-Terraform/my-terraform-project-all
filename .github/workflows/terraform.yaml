name: Terraform Hub-Spoke Network

# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:
  push:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# GITHUB ACTIONS PERMISSIONS
# ============================================================

permissions:
  contents: read
  id-token: write


# ============================================================
# PHASE 1
# HUB VPC
# ACCOUNT: 647132523867
# ============================================================

jobs:

  phase1-hub-vpc:

    name: "Phase 1 - Hub VPC"

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      AWS_REGION: ap-south-1

    steps:

      # --------------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. SETUP TERRAFORM
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8


      # --------------------------------------------------------
      # 3. AWS OIDC AUTHENTICATION
      # HUB ACCOUNT
      # --------------------------------------------------------

      - name: Configure AWS credentials - Hub
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::647132523867:role/github-actions-terraform-role-v1
          aws-region: ap-south-1


      # --------------------------------------------------------
      # 4. VERIFY AWS ACCOUNT
      # --------------------------------------------------------

      - name: Verify Hub AWS Account
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------------
      # 5. TERRAFORM INIT
      # --------------------------------------------------------

      - name: Terraform Init
        run: terraform init


      # --------------------------------------------------------
      # 6. TERRAFORM FORMAT
      # --------------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive


      # --------------------------------------------------------
      # 7. TERRAFORM VALIDATE
      # --------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate


      # --------------------------------------------------------
      # 8. PHASE 1 PLAN
      # HUB VPC
      # --------------------------------------------------------

      - name: Phase 1 - Plan Hub VPC
        run: terraform plan -target=module.hub_vpc -out=phase1.tfplan


      # --------------------------------------------------------
      # 9. PHASE 1 APPLY
      # HUB VPC
      # --------------------------------------------------------

      - name: Phase 1 - Apply Hub VPC
        run: terraform apply -auto-approve phase1.tfplan


# ============================================================
# PHASE 2
# SPOKE VPC
# ACCOUNT: 434097521299
# ============================================================

  phase2-spoke-vpc:

    name: "Phase 2 - Spoke VPC"

    needs:
      - phase1-hub-vpc

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      AWS_REGION: ap-south-1
      TF_VAR_spoke_role_arn: arn:aws:iam::434097521299:role/testingdummy

    steps:

      # --------------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. SETUP TERRAFORM
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8


      # --------------------------------------------------------
      # 3. AWS OIDC AUTHENTICATION
      # SPOKE ACCOUNT
      # --------------------------------------------------------

      - name: Configure AWS credentials - Spoke
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ap-south-1


      # --------------------------------------------------------
      # 4. VERIFY AWS ACCOUNT
      # --------------------------------------------------------

      - name: Verify Spoke AWS Account
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------------
      # 5. TERRAFORM INIT
      # --------------------------------------------------------

      - name: Terraform Init
        run: terraform init


      # --------------------------------------------------------
      # 6. TERRAFORM VALIDATE
      # --------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate


      # --------------------------------------------------------
      # 7. PHASE 2 PLAN
      # SPOKE VPC
      # --------------------------------------------------------

      - name: Phase 2 - Plan Spoke VPC
        run: terraform plan -target=module.spoke_vpc -out=phase2.tfplan


      # --------------------------------------------------------
      # 8. PHASE 2 APPLY
      # SPOKE VPC
      # --------------------------------------------------------

      - name: Phase 2 - Apply Spoke VPC
        run: terraform apply -auto-approve phase2.tfplan


# ============================================================
# PHASE 3
# TRANSIT GATEWAY
# HUB + SPOKE
# HUB ACCOUNT: 647132523867
# SPOKE ACCOUNT: 434097521299
# ============================================================

  phase3-transit-gateway:

    name: "Phase 3 - Transit Gateway"

    needs:
      - phase2-spoke-vpc

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      AWS_REGION: ap-south-1

      # Spoke role used by Terraform
      TF_VAR_spoke_role_arn: arn:aws:iam::434097521299:role/testingdummy

    steps:

      # --------------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. SETUP TERRAFORM
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8


      # --------------------------------------------------------
      # 3. AWS OIDC AUTHENTICATION
      # HUB ACCOUNT
      # --------------------------------------------------------

      - name: Configure AWS credentials - Hub
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::647132523867:role/github-actions-terraform-role-v1
          aws-region: ap-south-1


      # --------------------------------------------------------
      # 4. VERIFY AWS ACCOUNT
      # --------------------------------------------------------

      - name: Verify Hub AWS Account
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------------
      # 5. TERRAFORM INIT
      # --------------------------------------------------------

      - name: Terraform Init
        run: terraform init


      # --------------------------------------------------------
      # 6. TERRAFORM VALIDATE
      # --------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate


      # --------------------------------------------------------
      # 7. PHASE 3 PLAN
      # TRANSIT GATEWAY
      # --------------------------------------------------------

      - name: Phase 3 - Plan Transit Gateway
        run: terraform plan -target=module.transit_gateway -out=phase3.tfplan


      # --------------------------------------------------------
      # 8. PHASE 3 APPLY
      # TRANSIT GATEWAY
      # --------------------------------------------------------

      - name: Phase 3 - Apply Transit Gateway
        run: terraform apply -auto-approve phase3.tfplan


      # --------------------------------------------------------
      # 9. TERRAFORM STATE
      # --------------------------------------------------------

      - name: Terraform State
        run: terraform state list


      # --------------------------------------------------------
      # 10. TERRAFORM OUTPUTS
      # --------------------------------------------------------

      - name: Terraform Outputs
        run: terraform output  